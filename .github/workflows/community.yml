name: render community sections

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]

concurrency:
  group: render-community
  cancel-in-progress: true

jobs:
  render:
    permissions:
      contents: write
      discussions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render guestbook and threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: acharyabi
          GH_REPO: acharyabi
          GUESTBOOK_NUMBER: "3"
        run: python3 scripts/render_community.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update community sections"
          git push
