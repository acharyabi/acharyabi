name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: acharyabi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#008f11&color_dots=#e8ffe8,#a6f5b8,#4ade80,#16a34a,#008f11
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00ff41&color_dots=#161b22,#003b00,#006414,#00c721,#00ff41

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
