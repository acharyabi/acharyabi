name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: acharyabi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#111827&color_dots=#eef2f5,#2C7BB6,#ABD9E9,#FDAE61,#D7191C
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFFFFF&color_dots=#161b22,#2C7BB6,#ABD9E9,#FDAE61,#D7191C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
